name: PR6725 Regenerate Senpi Bundle

on:
  push:
    branches:
      - ci/pr6725-regenerate-senpi-20261102

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/doctor-config-summary

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Regenerate Senpi main bundle
        run: node packages/omo-senpi/plugin/scripts/build-extension.mjs

      - name: Commit regenerated main bundle
        shell: bash
        run: |
          set -euo pipefail
          git add packages/omo-senpi/plugin/extensions/omo.js
          if git diff --cached --quiet; then
            echo "Senpi main bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Senpi main bundle for doctor migration"
          git push origin HEAD:fix/doctor-config-summary
